name: Build APK with Docker
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            kivy/buildozer:latest \
            sh -c "yes | buildozer android debug"
      
      - name: List output
        run: ls -la bin/ 2>/dev/null || echo "No bin dir"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Bomber-Android-APK
          path: bin/*.apk
