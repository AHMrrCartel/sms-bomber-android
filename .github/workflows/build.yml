name: Build APK with Docker
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK with Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app kivy/buildozer:latest android debug || true
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: SMS-Bomber-Android
          path: bin/*
          compression-level: 0
